<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <title>角色查询</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
</head>
<body>
  <header class="header">
    <p id="meta">请选择服务器或任务，也可只输入昵称后查询。多个昵称换行。分享：<code>?task=任务key</code> 或 <code>?name=昵称</code></p>
  </header>

  <section class="filters card" id="filtersCard">
    <div class="filter-sheet-head mobile-only">
      <strong>筛选条件</strong>
      <button id="closeFilters" type="button" class="link-btn">完成</button>
    </div>
    <div class="row">
      <label>大区
        <select id="area">
          <option value="">全部</option>
        </select>
      </label>
      <label class="server-filter">
        服务器
        <div id="serverMulti" class="multiselect">
          <button
            id="serverMultiTrigger"
            type="button"
            class="multiselect-trigger"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-controls="serverList"
          >
            <span id="serverMultiLabel" class="multiselect-label">请选择服务器</span>
            <span class="multiselect-arrow" aria-hidden="true">▾</span>
          </button>
          <div id="serverMultiPanel" class="multiselect-panel" hidden>
            <div class="multiselect-search-wrap">
              <input
                id="serverSearch"
                type="search"
                class="multiselect-search"
                placeholder="搜索服务器（中文 / 拼音）"
                autocomplete="off"
                spellcheck="false"
                aria-label="搜索服务器"
              />
            </div>
            <div class="multiselect-toolbar">
              <button id="selectAllServers" type="button" class="link-btn">全选</button>
              <button id="clearServers" type="button" class="link-btn">清空</button>
            </div>
            <div id="serverList" class="multiselect-options" role="listbox" aria-multiselectable="true"></div>
          </div>
        </div>
      </label>
      <label class="server-filter">
        任务
        <div id="taskMulti" class="multiselect">
          <button
            id="taskMultiTrigger"
            type="button"
            class="multiselect-trigger"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-controls="taskList"
          >
            <span id="taskMultiLabel" class="multiselect-label">全部任务</span>
            <span class="multiselect-arrow" aria-hidden="true">▾</span>
          </button>
          <div id="taskMultiPanel" class="multiselect-panel" hidden>
            <div class="multiselect-toolbar">
              <button id="selectAllTasks" type="button" class="link-btn">全选</button>
              <button id="clearTasks" type="button" class="link-btn">清空</button>
            </div>
            <div id="taskList" class="multiselect-options" role="listbox" aria-multiselectable="true"></div>
          </div>
        </div>
      </label>
      <label>金币（万）≥<input id="goldMin" type="number" placeholder="如 100" step="1"></label>
      <label class="role-name-filter">昵称<textarea id="roleName" rows="3" placeholder="一行一个昵称，如：龙、太子" autocomplete="off"></textarea></label>
      <label>门派
        <select id="school">
          <option value="">全部</option>
        </select>
      </label>
      <label>最低价<input id="priceMin" type="number" placeholder="元"></label>
      <label>最高价<input id="priceMax" type="number" placeholder="元"></label>
      <label>金币/价格 ≥<input id="ratioMin" type="number" placeholder="如 0.60" step="0.01" min="0"></label>
      <button id="searchBtn" type="button">查询</button>
    </div>
    <div class="row filter-chips-row">
      <div class="chip-group">
        <span class="chip-group-label">上架状态</span>
        <div class="chip-list" role="group" aria-label="上架状态">
          <button id="saleFairShow" type="button" class="chip chip-sale-fair" data-value="fair_show" aria-pressed="true">公示期</button>
          <button id="saleOnsale" type="button" class="chip chip-sale-onsale" data-value="onsale" aria-pressed="true">上架中</button>
          <button id="saleSold" type="button" class="chip chip-sale-sold" data-value="sold" aria-pressed="true">已售出</button>
        </div>
      </div>
      <div class="chip-group">
        <span class="chip-group-label">重点物品</span>
        <div class="chip-list" role="group" aria-label="重点物品">
          <button id="hasShendoudou" type="button" class="chip chip-item-shendoudou" aria-pressed="false">神兜兜</button>
          <button id="hasBaoshichui" type="button" class="chip chip-item-baoshichui" aria-pressed="false">宝石锤</button>
        </div>
      </div>
      <div class="chip-group">
        <span class="chip-group-label">召唤灵</span>
        <div class="chip-list" role="group" aria-label="宠物格子">
          <button id="petSlotGt12" type="button" class="chip chip-pet-slot" data-min="12" aria-pressed="false">格子&gt;12</button>
        </div>
        <label class="chip-inline-label">格子&gt;<input id="petSlotMin" type="number" placeholder="如 12" min="0" step="1"></label>
      </div>
    </div>
    <details class="material-prices" id="materialPricesPanel">
      <summary>物资折算单价（本地保存，影响物资比 / 估算金币）</summary>
      <div class="row material-prices-grid">
        <label>神兜兜（金币）<input id="priceShendoudou" type="number" min="0" step="1000"></label>
        <label>宝石锤（金币）<input id="priceBaoshichui" type="number" min="0" step="1000"></label>
        <label>金柳露（金币）<input id="priceJinliulu" type="number" min="0" step="1"></label>
        <label title="仓库物品中「{法宝名}·精华」，不含礼包">法宝·精华（金币）<input id="priceFabaoJinghua" type="number" min="0" step="1000"></label>
        <label>神兽（金币）<input id="priceShenshou" type="number" min="0" step="100000"></label>
        <label>纹饰（金币）<input id="priceWenshi" type="number" min="0" step="100"></label>
        <label>彩果（金币）<input id="priceCaiguo" type="number" min="0" step="100"></label>
        <label>召唤灵积分券（金币）<input id="pricePetTicket" type="number" min="0" step="100"></label>
        <label>定魂珠/金刚石（金币）<input id="priceDinghun" type="number" min="0" step="1000"></label>
        <label>中级符纸（金币）<input id="priceMidFushi" type="number" min="0" step="100"></label>
        <label>高级符纸（金币）<input id="priceHighFushi" type="number" min="0" step="100"></label>
        <label>物资比金柳露≥<input id="priceJinliuluMin" type="number" min="0" step="1" title="物资比中仅当金柳露数量达到该值才计入"></label>
        <button id="resetMaterialPrices" type="button" class="link-btn">恢复默认</button>
      </div>
    </details>
  </section>

  <section class="tabs card">
    <button class="tab active" data-tab="roles">角色汇总</button>
    <button class="tab" data-tab="details">明细列表</button>
    <button class="tab" data-tab="pets">召唤灵</button>
  </section>

  <section id="pagination" class="pagination card" hidden>
    <button id="prevPage" type="button">上一页</button>
    <span id="pageInfo"></span>
    <button id="nextPage" type="button">下一页</button>
  </section>

  <main>
    <div id="rolesPanel" class="panel active"></div>
    <div id="detailsPanel" class="panel"></div>
    <div id="petsPanel" class="panel"></div>
  </main>

  <div id="roleModal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-dialog">
      <button class="modal-close" type="button" data-close aria-label="关闭">&times;</button>
      <div id="roleModalBody"></div>
    </div>
  </div>

  <div class="mobile-bar mobile-only">
    <button id="openFilters" type="button" class="mobile-bar-btn">筛选</button>
    <button id="searchBtnMobile" type="button" class="mobile-bar-btn primary">查询</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
